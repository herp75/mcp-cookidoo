name: Live tests

# Runs the tests in tests/live against the real Cookidoo API with a dedicated test account.
# Only on a schedule or by hand, never for pull requests: the secrets live in the "live"
# environment, which only the main branch may use.

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:
    inputs:
      write:
        description: "Also run the tests that create (and remove) data on the test account"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: live-tests # one run at a time: the tests share the test account
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # to report a changed Cookidoo editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Live tests
        env:
          COOKIDOO_TEST_EMAIL: ${{ secrets.COOKIDOO_TEST_EMAIL }}
          COOKIDOO_TEST_PASSWORD: ${{ secrets.COOKIDOO_TEST_PASSWORD }}
          COOKIDOO_TEST_COUNTRY: ${{ vars.COOKIDOO_TEST_COUNTRY || 'ch' }}
          COOKIDOO_TEST_LANGUAGE: ${{ vars.COOKIDOO_TEST_LANGUAGE || 'de-CH' }}
          COOKIDOO_EDITOR_REPORT: ${{ github.workspace }}/editor-report.md
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
        # -p no:logging and --assert=plain: no captured logs or compared values in the job log
        run: |
          mode=--live
          if [ "$WRITE" = "true" ]; then mode=--live-write; fi
          uv run pytest tests/live "$mode" -p no:logging -p no:cacheprovider --assert=plain -v
      - name: Report a changed Cookidoo editor
        if: always() && hashFiles('editor-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Cookidoo recipe editor changed
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file editor-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file editor-report.md
          fi
      - name: Report a failed run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Live tests failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Only the link: the job log is the place for details
        run: |
          body="The scheduled live tests failed: $RUN_URL. A likely cause is a change of the Cookidoo API."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
