name: Release

# Pushing a tag vX.Y.Z releases that version: full CI and security checks first, then the
# signed Docker image (ghcr.io), the Claude Desktop bundle (.mcpb) with build provenance, the
# GitHub Release with the changelog section, and the MCP Registry entry. No PyPI package.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag, pyproject.toml, server.json and CHANGELOG agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          registry=$(jq -r .version server.json)
          test "$project" = "$version" || { echo "::error::pyproject.toml has $project"; exit 1; }
          test "$registry" = "$version" || { echo "::error::server.json has $registry"; exit 1; }
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "::error::no CHANGELOG section for $version"; exit 1; }

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    needs: check
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  docker:
    needs: [ci, security]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  github-release:
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Build the Claude Desktop bundle
        run: uv run python scripts/build_mcpb.py
      - run: cp server.json dist/server.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat notes.md
            echo
            echo "## Install"
            echo
            echo '- Docker: `ghcr.io/'"$GITHUB_REPOSITORY"':'"${GITHUB_REF_NAME#v}"'` (signed with cosign, see README)'
            echo '- Claude Desktop: download the `.mcpb` file below and open it'
          } > body.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file body.md --verify-tag dist/*

  mcp-registry:
    needs: [docker, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # log in to the MCP Registry with GitHub OIDC
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install mcp-publisher (signature verified)
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sigstore.json"
          cosign verify-blob "$archive" --bundle "$archive.sigstore.json" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION"
          tar xzf "$archive" mcp-publisher
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
