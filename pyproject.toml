[project]
name = "cookidoo-mcp-server"
version = "1.1.0"
description = "MCP server for interacting with the Thermomix Cookidoo platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.2,<5",
    "cookidoo-api>=0.19,<0.20",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pyright>=1.1.400,<2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6,<8",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["*.py", "tools", "tests"]
venvPath = "."
venv = ".venv"
# Tests use mocks and loosely typed MCP results; keep the strictness for the server code.
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportAttributeAccessIssue = "none", reportOptionalMemberAccess = "none", reportArgumentType = "none", reportTypedDictNotRequiredAccess = "none" },
    { root = "." },
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
